research_task:
  description: >
    Effectuez des recherches approfondies et vérifiées sur le sujet suivant : {prompt}.

    INSTRUCTIONS DE VÉRIFICATION OBLIGATOIRES:
    - Pour CHAQUE information clé, trouvez au moins 2 sources indépendantes confirmant
      le fait avant de le considérer comme validé
    - Créez un tableau de traçabilité dans votre recherche avec colonnes:
      [Fait affirmé] | [Source 1 URL + date de consultation] | [Source 2 URL + date]
      | [Niveau de confiance: Élevé/Moyen/Faible] | [Notes sur discrepances]
    - Évaluez le niveau de confiance:
      * Élevé: 2+ sources officielles récentes (<12 mois)
      * Moyen: 1 source officielle + 1 source expatrié fiable OU 2 sources expatriés
        récents
      * Faible: 1 seule source OU sources contradictoires - DOIT être flaggé
    - REJETEZ toute information de niveau faible sans confirmation supplémentaire
    - Pour les faits de niveau moyen/faible, ajoutez une note explicative dans vos
      recherches détaillant pourquoi vous les incluez malgré tout

    INSTRUCTIONS DE SOURCES:
    - Cherchez des sources officielles en priorité : gov.uk, mygov.scot, NHS Écosse,
      HMRC, ambassade de France à Londres, consulat de France à Édimbourg.
    - Incluez également des blogs d'expatriés francophones reconnus et des forums
      actifs (The French Group Edinburgh, Français en Écosse, etc.).
    - Pour chaque information clé, notez l'URL source complète et la date de dernière
      mise à jour si disponible.

    DIRECTIVES POUR PROMPTS DÉTAILLÉS:
    - Si le prompt contient des questions spécifiques ou des points à couvrir (ex: "incluez X, Y, Z"),
      priorisez-y répondre dans vos recherches
    - Identifiez explicitement les 5-8 questions que le prompt suggère que le lecteur se pose
    - Organisez vos recherches par thématique pour correspondre aux demandes du prompt

    POINTS DE VÉRIFICATION FINAL:
    - Avez-vous triangulé chaque fait principal?
    - Avez-vous évalué la confiance pour chaque fait?
    - Avez-vous identifié les faits à confiance faible?
    - Avez-vous couvert tous les points spécifiques mentionnés dans le prompt?
  expected_output: >
    Un compte-rendu de recherche structuré EN FRANÇAIS contenant:
    1. Résumé exécutif (5-10 points clés) AVEC niveau de confiance pour chaque point
    2. Informations détaillées par sous-thème, chacune avec sa source URL et niveau
       de confiance
    3. Tableau de traçabilité complète des faits (voir format ci-dessus)
    4. Les 5-8 questions fréquentes des francophones sur ce sujet
    5. Conseils pratiques et pièges à éviter
    6. Liste des sources avec URL complète, date de consultation et évaluation de
       fiabilité
    7. Section "Limites et incertitudes" listant les faits de confiance faible ou
       moyenne
  agent: researcher

planning_task:
  description: >
    Sur la base du compte-rendu de recherche fourni et du prompt initial : {prompt},
    créez un plan d'article de blog simple et direct.

    STRUCTURE OBLIGATOIRE:
    - Maximum 2 sections H2 (pas plus)
    - PAS de sections H3
    - Structurez simplement: introduction → développement (1-2 H2) → conclusion

    DIRECTIVES:
    - Si le prompt contient des demandes spécifiques, intégrez-les naturellement
      dans les H2 sans créer de sous-sections
    - Identifiez le mot-clé SEO principal automatiquement à partir du prompt
    - Évitez de créer des sections pour chaque point du prompt - fusionnez-les
    - Ne prévoyez PAS d'emplacement pour anecdotes personnelles spécifiques

    Instructions précises :
    - Proposez un titre principal H1 accrocheur
    - Maximum 2 sections H2 maximum (pas de H3)
    - Chaque H2 couvre plusieurs aspects du sujet de façon naturelle
    - La conclusion doit inclure un appel à l'action ou une invitation au commentaire.
    - Rédigez TOUT en FRANÇAIS.
  expected_output: >
    Un plan d'article EN FRANÇAIS comprenant :
    - H1 proposé (avec variante alternative)
    - Maximum 2 sections H2 avec leur contenu attendu (pas de H3)
    - Note éditoriale sur le ton à adopter (général, pas d'anecdotes spécifiques)
    - Mot-clé SEO identifié à partir du prompt
  agent: planner
  context:
    - research_task

writing_task:
  description: >
    Rédigez l'article complet EN FRANÇAIS d'environ {word_count} mots sur {prompt}.

    POINT DE DÉPART OBLIGATOIRE :
    Avant d'écrire la moindre phrase, lisez intégralement :
    (1) le plan produit par le Stratège Éditorial — utilisez son H1 et ses H2
        comme squelette de l'article. Ne réorganisez pas, ne renommez pas les sections.
    (2) le compte-rendu de recherche — toutes les informations factuelles et sources
        que vous citez DOIVENT provenir de ce document.

    STRUCTURE OBLIGATOIRE:
    - PAS de sections H3 - seulement H1 et H2
    - Si le plan contient des H3, fusionnez-les naturellement dans les H2
    - Utilisez des paragraphes simples pour organiser le contenu sous chaque H2

    INSTRUCTIONS DE TRAÇABILITÉ OBLIGATOIRES:
    - CHAQUE affirmation factuelle dans votre article doit être directement traçable
      vers une entrée spécifique du tableau de traçabilité du chercheur
    - Utilisez des citations inline discrètes sous la forme [Fait #X] où X correspond
      à la ligne du tableau de traçabilité du chercheur
    - En fin d'article, avant la section "Sources et liens utiles", ajoutez une section
      "Traçabilité des faits" listant:
      [Paragraphe ou section de l'article] → [Fait #X du chercheur] → [Niveau de confiance]
    - N'utilisez AUCUN fait marqué comme "confiance faible" sans ajouter une indication
      explicite d'incertitude dans votre texte (ex: "Les informations varient selon...",
      "Il semble que...", "Selon les sources disponibles en [date]")
    - Si un fait du chercheur est marqué comme contradictoire, présentez les différentes
      versions avec leurs sources respectives

    Instructions précises :
    - Respectez strictement la structure H1/H2 définie dans le plan (pas de H3).
    - N'inventez aucune information : utilisez exclusivement les faits du compte-rendu de recherche.
    - Alternez paragraphes narratifs et éléments pratiques (listes, étapes numérotées).
    - Citez vos sources naturellement dans le texte ("Selon le site officiel gov.uk...")
      sans style académique lourd.
    - Ajoutez en fin d'article une section "Sources et liens utiles" avec les URLs.
    - Évitez absolument : "Il est important de noter", "En conclusion,",
      "N'hésitez pas à", les listes à puces sans contexte narratif.
    - Rédigez TOUT en FRANÇAIS, format Markdown.
  expected_output: >
    Le brouillon complet de l'article EN FRANÇAIS au format Markdown, incluant :
    - Titre H1
    - Corps de l'article structuré selon le plan (H2 maximum, PAS de H3)
    - Section "Traçabilité des faits" entre l'article et "Sources et liens utiles"
    - Section "Sources et liens utiles" en fin d'article
    - Estimation du nombre de mots en fin de document
  agent: writer
  context:
    - research_task
    - planning_task

seo_optimization_task:
  description: >
    Optimisez le brouillon de l'article pour le référencement naturel.

    Mot-clé principal : {keyword}
    Sujet : {prompt}

    DIRECTIVES POUR EXTRACTION DE MOTS-CLÉS:
    - Si {keyword} est vide ou non fourni, extraitez le mot-clé principal à partir du prompt
      en identifiant le thème central et les lieux/objets importants
    - Analysez la densité du mot-clé principal et de ses variantes sémantiques.
      Objectif : présence naturelle dans le titre, le premier paragraphe, 2-3 H2
      et la conclusion — sans bourrage.
    - Proposez un titre SEO H1 optimisé (55-60 caractères idéalement).
    - Rédigez une méta-description EN FRANÇAIS (150-160 caractères) incluant
      le mot-clé et un verbe d'action.
    - Suggérez 5 mots-clés secondaires / longue traîne à intégrer naturellement.
    - Identifiez les H2/H3 qui pourraient bénéficier d'une reformulation SEO.

    PLACEMENT DES MÉTADONNÉES:
    - Ajoutez les métadonnées SEO à la FIN de l'article, pas au début
    - Titre de la section: "SEO" ou "Métadonnées SEO"
    - Placez cette section après la conclusion et avant la section "Sources et liens utiles"

    - Tout le contenu reste EN FRANÇAIS, naturel et lisible.
  expected_output: >
    Version optimisée de l'article EN FRANÇAIS au format Markdown, avec les
    métadonnées SEO à la fin de l'article (pas au début):
    - Titre SEO proposé
    - Méta-description (150-160 caractères)
    - Mots-clés secondaires retenus
    - Note sur les modifications apportées
  agent: seo_optimizer
  context:
    - writing_task

editing_task:
  description: >
    Réviser l'article produit par le rédacteur. 
    Appliquez rigoureusement les règles de mon GUIDE DE STYLE (ton, vocabulaire, structure).
    Assurez-vous que l'article ne ressemble pas à un texte généré par IA mais à un post 
    chaleureux d'un expatrié français en Écosse.
  expected_output: >
    L'article finalisé avec ma voix personnelle, en français impeccable.
  agent: editor
  context:
    - seo_optimization_task

quality_review_task:
  description: >
    Effectuez la vérification finale de l'article avant publication.

    MÉTHODE DE VÉRIFICATION SYSTÉMATIQUE:
    1. Vérification croisée: Comparez chaque affirmation factuelle avec les notes de
       recherche du chercheur pour confirmer la traçabilité
    2. Source verification checklist: Pour chaque source majeure, vérifiez que l'URL
       est accessible et que la date de consultation est inférieure à 12 mois
    3. Confiance triangulaire: Croisez les affirmations avec les niveaux de confiance
       fournis par le chercheur - traiter les niveaux Moyen/Faible avec une attention
       accrue

    Trois axes de contrôle obligatoires :

    1. EXACTITUDE FACTUELLE
       - Vérifiez chaque chiffre cité (prix, délais, dates, statistiques).
       - Vérifiez les noms propres : lieux (Édimbourg, pas Edimbourg), institutions,
         lois (UK GDPR, Settled Status, etc.).
       - Signalez toute information potentiellement obsolète avec [À VÉRIFIER + raison].

    2. SOURCES
       - Vérifiez que chaque fait majeur est sourcé.
       - Identifiez les affirmations sans source et marquez-les [SOURCE MANQUANTE].

    3. QUALITÉ DU FRANÇAIS
       - Orthographe, grammaire, conjugaison, accords.
       - Typographie française : guillemets «», espaces insécables (: ; ! ?),
         majuscules accentuées (É, À, Ê).
       - Ponctuation cohérente.

    4. STRUCTURE DE L'ARTICLE
       - Vérifiez que la section "Traçabilité des faits" est présente entre l'article
         principal et "Sources et liens utiles". Si elle est absente, ajoutez-la avec
         une note: [TRACÉBITÉ AJOUTÉE PAR RAPPEL]
       - Vérifiez que la section SEO (mots-clés et description) est présente à la fin
         de l'article, après la conclusion. Si elle est absente ou en haut, déplacez-la.

    5. ANECDOTES PERSONNELLES
       - IDENTIFIEZ toute anecdote personnelle ou expérience vécue spécifique
       - Si l'anecdote semble inventée (pas sourcée, trop précise comme "j'ai trouvé...",
         "mon ami Thomas m'a dit..."), marquez-la [ANECDOTE À VÉRIFIER] ou suggérez
         une reformulation générique ("On peut trouver...", "Beaucoup trouvent...")
       - Vérifiez que la structure n'a pas trop de sections (max 2 H2)

    Appliquez les corrections directement dans le texte.
    Indiquez chaque correction avec la balise [CORRECTION : ancienne version → nouvelle version].
  expected_output: >
    L'article final EN FRANÇAIS, prêt à copier-coller sur WordPress/Ghost,
    au format Markdown, avec :
    - Toutes les corrections appliquées
    - Un résumé des corrections en fin de document sous le titre
      "## Journal des corrections"
    - La mention [PRÊT POUR PUBLICATION] en toute fin si aucun point bloquant
      n'a été identifié
  agent: quality_reviewer
  context:
    - editing_task
  output_file: "articles/final_version_{timestamp}.md"